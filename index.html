<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lumos Dash</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Arial Black', sans-serif; user-select: none; color: #fff; }
        canvas { display: block; }

        .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20;
        }

        .stats { position: absolute; top: 20px; left: 20px; font-size: 22px; z-index: 10; text-shadow: 0 0 10px #ff0; }
        .lumos-counter { color: #ff0; }

        .btn {
            padding: 14px 30px; margin: 8px; border: 3px solid #0ff; background: none;
            color: #0ff; cursor: pointer; font-size: 18px; transition: 0.3s; min-width: 260px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; transform: scale(1.05); }

        .social-box { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 25px; width: 100%; }
        .social-label { font-size: 11px; color: #555; letter-spacing: 1px; margin-bottom: 2px; }

        .btn-social {
            border: 1px solid #24A1DE; color: #24A1DE; font-size: 13px; min-width: 220px;
            padding: 10px; cursor: pointer; background: rgba(36, 161, 222, 0.05); transition: 0.3s;
            text-decoration: none; text-align: center; font-family: sans-serif; font-weight: bold;
        }
        .btn-social:hover { background: #24A1DE; color: #fff; box-shadow: 0 0 15px #24A1DE; }

        .shop-container { overflow-y: auto; max-height: 85vh; padding: 20px; text-align: center; width: 90%; max-width: 500px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }

        .item {
            width: 60px; height: 60px; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            position: relative; font-size: 24px; background: rgba(255,255,255,0.05);
        }
        .item.selected { border-color: #0ff; background: rgba(0,255,255,0.2); box-shadow: 0 0 15px #0ff; }
    </style>
</head>
<body>

    <div class="stats">🌟 <span class="lumos-counter" id="lumosCount">0</span></div>
    <div id="pause-btn" style="position: absolute; top: 20px; right: 20px; color: #fff; border: 2px solid #fff; padding: 8px 20px; cursor: pointer; z-index: 30; background: rgba(0,0,0,0.6);" onclick="togglePause()">PAUSE [P]</div>

    <div id="main-menu" class="overlay">
        <h1 style="color: #0ff; font-size: 50px; margin-bottom: 10px; text-shadow: 0 0 30px #0ff;">LUMOS DASH</h1>
        <button class="btn" onclick="showDifficulty()">ИГРАТЬ</button>
        <button class="btn" onclick="openShop()">МАГАЗИН</button>

        <div class="social-box">
            <div class="social-label">CONTACT US:</div>
            <button class="btn-social" onclick="window.open('https://t.me/PrimeDrops712', '_blank')">@PrimeDrops712</button>
        </div>
    </div>

    <div id="diff-menu" class="overlay" style="display:none">
        <h2 style="font-size: 26px; color: #0ff;">ВЫБЕРИ РЕЖИМ</h2>
        <button class="btn" onclick="startGame('easy')" style="border-color:#0f0; color:#0f0">ZEN (EASY)</button>
        <button class="btn" onclick="startGame('normal')" style="border-color:#ff0; color:#ff0">DASH (NORMAL)</button>
        <button class="btn" onclick="startGame('hard')" style="border-color:#f00; color:#f00">LUMOS (HARD)</button>
        <button class="btn" onclick="hideDifficulty()" style="border-color:#555; color:#555;">НАЗАД</button>
    </div>

    <div id="pause-menu" class="overlay" style="display:none;"><h1 style="color:#ff0; font-size: 50px;">ПАУЗА</h1><button class="btn" onclick="togglePause()">ПРОДОЛЖИТЬ</button><button class="btn" onclick="location.reload()">В МЕНЮ</button></div>
    <div id="shop" class="overlay" style="display:none"><div class="shop-container"><h2 style="color: #ff0;">VAULT (🌟 <span id="shopLumos">0</span>)</h2><h4>ЛИЦА (15 🌟)</h4><div class="grid" id="faces-grid"></div><h4>ЦВЕТА (30 🌟)</h4><div class="grid" id="colors-grid"></div><h4>АКСЕССУАРЫ (50 🌟)</h4><div class="grid" id="acc-grid"></div><button class="btn" onclick="closeShop()">ВЫХОД</button></div></div>

    <canvas id="game"></canvas>

<script>
// Настройки игры и скрипты (оставлены без изменений для работы легкого уровня)
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameState = {
    lumos: parseInt(localStorage.getItem('LD_lumos')) || 0,
    unF: JSON.parse(localStorage.getItem('LD_unF')) || ['🙂'],
    unC: JSON.parse(localStorage.getItem('LD_unC')) || ['#0ff'],
    unA: JSON.parse(localStorage.getItem('LD_unA')) || ['✖️'],
    face: localStorage.getItem('LD_face') || '🙂',
    color: localStorage.getItem('LD_color') || '#0ff',
    acc: localStorage.getItem('LD_acc') || '✖️',
    diff: 'normal'
};

const faces = ['🙂', '😎', '😡', '😱', '😈', '🤡', '🤖', '👻'];
const colors = ['#0ff', '#f0f', '#0f0', '#ff0', '#f00', '#fff'];
const accessories = ['✖️', '🎩', '👑', '😇', '🎧', '🚀'];

function save() {
    localStorage.setItem('LD_lumos', gameState.lumos);
    localStorage.setItem('LD_unF', JSON.stringify(gameState.unF));
    localStorage.setItem('LD_unC', JSON.stringify(gameState.unC));
    localStorage.setItem('LD_unA', JSON.stringify(gameState.unA));
    localStorage.setItem('LD_face', gameState.face);
    localStorage.setItem('LD_color', gameState.color);
    localStorage.setItem('LD_acc', gameState.acc);
    document.getElementById('lumosCount').innerText = gameState.lumos;
}

function openShop() { document.getElementById('main-menu').style.display='none'; document.getElementById('shop').style.display='flex'; updateShopUI(); }
function closeShop() { document.getElementById('shop').style.display='none'; document.getElementById('main-menu').style.display='flex'; save(); }

function updateShopUI() {
    document.getElementById('shopLumos').innerText = gameState.lumos;
    renderCategory('faces-grid', faces, 'face', 15, gameState.unF);
    renderCategory('colors-grid', colors, 'color', 30, gameState.unC, true);
    renderCategory('acc-grid', accessories, 'acc', 50, gameState.unA);
}

function renderCategory(containerId, items, type, price, unlockedList, isColor = false) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    items.forEach(item => {
        const isUnlocked = unlockedList.includes(item);
        const isSelected = gameState[type] === item;
        const el = document.createElement('div');
        el.className = `item ${isSelected ? 'selected' : ''}`;
        if (!isUnlocked) el.style.opacity = '0.5';
        if (isColor) el.style.background = item; else el.innerText = item;
        el.onclick = () => {
            if (isUnlocked) gameState[type] = item;
            else if (gameState.lumos >= price) { gameState.lumos -= price; unlockedList.push(item); gameState[type] = item; }
            save(); updateShopUI();
        };
        container.appendChild(el);
    });
}

let isPlaying = false, isPaused = false, speed = 10, objects = [], gravity = 0.9, jumpForce = -15, spawnTimer = 0;
let player = { x: 150, y: 0, w: 50, h: 50, dy: 0, rot: 0, ground: false };

function showDifficulty() { document.getElementById('main-menu').style.display='none'; document.getElementById('diff-menu').style.display='flex'; }
function hideDifficulty() { document.getElementById('main-menu').style.display='flex'; document.getElementById('diff-menu').style.display='none'; }

function startGame(d) {
    gameState.diff = d;
    document.getElementById('diff-menu').style.display='none';
    isPlaying = true; isPaused = false; objects = [];
    player.y = canvas.height - 150; player.dy = 0;
    if (d === 'easy') { speed = 7.0; gravity = 1.5; jumpForce = -18.5; }
    else if (d === 'normal') { speed = 12.5; gravity = 1.0; jumpForce = -16.5; }
    else { speed = 18.5; gravity = 0.95; jumpForce = -15.5; }
}

function togglePause() {
    if(!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
}

function die() { isPlaying = false; document.getElementById('main-menu').style.display = 'flex'; save(); }

function update() {
    if(!isPlaying || isPaused) return;
    player.dy += gravity;
    player.y += player.dy;
    const gLine = canvas.height - 100;
    if(player.y + player.h > gLine) { player.y = gLine - player.h; player.dy = 0; player.ground = true; }
    else player.ground = false;

    if(!player.ground) player.rot += (speed * 0.8);
    else player.rot = Math.round(player.rot / 90) * 90;

    spawnTimer++;
    let spawnRate = gameState.diff === 'easy' ? 85 : 35;
    if(spawnTimer > spawnRate) {
        const x = canvas.width + 100;
        const r = Math.random();
        let spikeChance = gameState.diff === 'easy' ? 0.15 : 0.45;
        if(r < spikeChance) objects.push({x, y: gLine - 40, w: 40, h: 40, type: 'spike'});
        else if(r < 0.7) objects.push({x, y: gLine - 35, w: 30, h: 30, type: 'star'});
        else {
            const blockW = gameState.diff === 'easy' ? 260 : 150;
            objects.push({x, y: gLine - 120, w: blockW, h: 25, type: 'block'});
        }
        spawnTimer = 0;
    }

    for (let i = objects.length - 1; i >= 0; i--) {
        let o = objects[i]; o.x -= speed;
        let padding = gameState.diff === 'easy' ? 12 : 8;
        const hit = player.x + padding < o.x + o.w && player.x + player.w - padding > o.x &&
                    player.y + padding < o.y + o.h && player.y + player.h - padding > o.y;
        if(hit) {
            if(o.type === 'spike') die();
            else if(o.type === 'star') {
                gameState.lumos += (gameState.diff === 'easy' ? 1 : 2);
                objects.splice(i, 1);
                document.getElementById('lumosCount').innerText = gameState.lumos;
            } else if(o.type === 'block' && player.dy > 0 && player.y + player.h < o.y + 35) {
                player.y = o.y - player.h; player.dy = 0; player.ground = true;
            } else if(o.type === 'block') die();
        }
        if(o.x + o.w < -50) objects.splice(i, 1);
    }
}

function draw() {
    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, canvas.height-100); ctx.lineTo(canvas.width, canvas.height-100); ctx.stroke();
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.rotate(player.rot * Math.PI / 180);
    ctx.shadowBlur = 25; ctx.shadowColor = gameState.color;
    ctx.fillStyle = gameState.color; ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = '28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(gameState.face, 0, 2);
    if(gameState.acc !== '✖️') { ctx.font = '26px Arial'; ctx.fillText(gameState.acc, 0, -40); }
    ctx.restore();
    objects.forEach(o => {
        if(o.type === 'spike') {
            ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.moveTo(o.x, o.y+o.h); ctx.lineTo(o.x+o.w/2, o.y); ctx.lineTo(o.x+o.w, o.y+o.h); ctx.fill();
        } else if(o.type === 'star') {
            ctx.font = '32px Arial'; ctx.fillText('⭐', o.x, o.y + 25);
        } else { ctx.fillStyle = '#fff'; ctx.fillRect(o.x, o.y, o.w, o.h); }
    });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
const hI = () => { if(player.ground && isPlaying && !isPaused) player.dy = jumpForce; };
window.addEventListener('keydown', (e) => { if(e.code === 'Space') hI(); if(e.code === 'KeyP') togglePause(); });
canvas.addEventListener('mousedown', hI);
save(); loop();
</script>
</body>
</html>
